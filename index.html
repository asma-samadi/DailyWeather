<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="body-tag">
    <header class="header-tag">
      <div class="input-tags">
        <input
          class="first-input"
          type="text"
          placeholder="Enter a city..."
          required
        />
        <input class="second-input" type="submit" value="Search" required />
      </div>
      <div class="h1-tag">
        <h1>Paris</h1>
      </div>
      <div class="details">
        <header class="first-details">
          <div>
            <strong><span class="day">Saturday</span></strong>
            <br />
            <div class="degree-icon">
              <span class="degree">30 </span>
              <div class="degree-symbol-icon">
                <span class="degree-symbol">° </span>
                <div class="icon-tag">
                  <span class="icon">☀️</span>
                </div>
              </div>
            </div>
          </div>
          <span class="situation">clear sky</span>
        </header>
        <header class="second-details">
          <span>Time: 12:8</span>
          <br />
          <span>Humidity:93%</span>
          <br />
          <span>Wind: 6.69km/h</span>
        </header>
      </div>
    </header>
  </body>
</html>
